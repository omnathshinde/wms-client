<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Client</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<style>
			body {
				margin: 0;
				padding: 0;
			}

			:root {
				--bg: #ffffff;
				--text: #16162b;
				--dot: #001233;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #001233;
					--text: #e6e6e6;
					--dot: #ffffff;
				}
			}

			#splash {
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				background: var(--bg);
				transition: opacity 0.3s ease-in-out;
				opacity: 1;
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				z-index: 9999;
			}

			app-root {
				display: none;
			}

			body.loaded app-root {
				display: block;
			}

			body.fade-out #splash {
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.4s ease-in-out;
			}

			.bouncing-dots {
				display: flex;
				justify-content: space-between;
				width: 60px;
			}

			.dot {
				width: 15px;
				height: 15px;
				background-color: var(--dot);
				border-radius: 50%;
				animation: bounce 1.5s infinite;
			}

			.dot:nth-child(1) {
				animation-delay: 0s;
			}

			.dot:nth-child(2) {
				animation-delay: 0.3s;
			}

			.dot:nth-child(3) {
				animation-delay: 0.6s;
			}

			@keyframes bounce {
				0%,
				100% {
					transform: translateY(0);
				}

				50% {
					transform: translateY(-20px);
				}
			}
		</style>
		<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
	</head>

	<body>
		<div id="splash">
			<div class="bouncing-dots">
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
			</div>
		</div>
		<app-root></app-root>
	</body>
</html>

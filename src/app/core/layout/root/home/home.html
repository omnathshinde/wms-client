<div class="app-root">
	<!-- Toolbar -->
	<mat-toolbar color="primary">
		<mat-icon>dashboard</mat-icon>
		<span>Dashboard Material Components Demo</span>
		<button
			mat-icon-button
			type="button"
			(click)="themeService.toggle()"
			[attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
			[matTooltip]="themeService.isDark() ? 'Light mode' : 'Dark mode'"
		>
			<mat-icon>
				{{ themeService.isDark() ? "light_mode" : "dark_mode" }}
			</mat-icon>
		</button>

		<span class="spacer"></span>
	</mat-toolbar>

	<!-- Layout -->
	<mat-sidenav-container class="container">
		<!-- Sidenav -->
		<mat-sidenav mode="side" opened>
			<mat-nav-list>
				<a mat-list-item>
					<mat-icon matListIcon>home</mat-icon>
					Home
				</a>
				<a mat-list-item>
					<mat-icon matListIcon>settings</mat-icon>
					Settings
				</a>
				<a mat-list-item>
					<mat-icon matListIcon>info</mat-icon>
					About
				</a>
			</mat-nav-list>
		</mat-sidenav>

		<!-- Main content -->
		<mat-sidenav-content class="content">
			<mat-card>
				<span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-sm"> Active </span>
			</mat-card>
			<!-- Buttons -->
			<mat-card>
				<mat-card-title>Buttons</mat-card-title>

				<button mat-raised-button color="primary">Primary</button>
				<button mat-raised-button color="accent">Accent</button>
				<button mat-raised-button color="warn">Warn</button>

				<br /><br />

				<button mat-stroked-button color="primary">Stroked</button>
				<button mat-flat-button color="accent">Flat</button>
				<button mat-icon-button color="warn">
					<mat-icon>delete</mat-icon>
				</button>
			</mat-card>

			<!-- Form controls -->
			<mat-card>
				<mat-card-title>Form Controls</mat-card-title>

				<mat-form-field appearance="outline">
					<mat-label>Name</mat-label>
					<input matInput placeholder="Enter name" />
				</mat-form-field>

				<mat-form-field appearance="outline">
					<mat-label>Role</mat-label>
					<mat-select>
						<mat-option value="dev">Developer</mat-option>
						<mat-option value="qa">QA</mat-option>
					</mat-select>
				</mat-form-field>

				<mat-checkbox color="primary">Active</mat-checkbox>
				<br />
				<mat-radio-group>
					<mat-radio-button value="yes">Yes</mat-radio-button>
					<mat-radio-button value="no">No</mat-radio-button>
				</mat-radio-group>
			</mat-card>

			<!-- Tabs -->
			<mat-card>
				<mat-tab-group>
					<mat-tab label="Tab 1">Content 1</mat-tab>
					<mat-tab label="Tab 2">Content 2</mat-tab>
					<mat-tab label="Tab 3">Content 3</mat-tab>
				</mat-tab-group>
			</mat-card>

			<!-- Table -->
			<mat-card>
				<mat-card-title>Users Table</mat-card-title>

				<table mat-table [dataSource]="users" class="mat-elevation-z2">
					<ng-container matColumnDef="name">
						<th mat-header-cell *matHeaderCellDef>Name</th>
						<td mat-cell *matCellDef="let user">
							{{ user.name }}
						</td>
					</ng-container>

					<ng-container matColumnDef="role">
						<th mat-header-cell *matHeaderCellDef>Role</th>
						<td mat-cell *matCellDef="let user">
							{{ user.role }}
						</td>
					</ng-container>

					<ng-container matColumnDef="active">
						<th mat-header-cell *matHeaderCellDef>Active</th>
						<td mat-cell *matCellDef="let user">
							@if (user.active) {
								<mat-chip color="primary">Yes</mat-chip>
							} @else {
								<mat-chip color="warn">No</mat-chip>
							}
						</td>
					</ng-container>

					<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
					<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
				</table>
			</mat-card>

			<!-- Menu + Tooltip -->
			<mat-card>
				<button mat-button color="primary" [matMenuTriggerFor]="menu">Open Menu</button>

				<mat-menu #menu="matMenu">
					<button mat-menu-item>
						<mat-icon>edit</mat-icon>
						Edit
					</button>
					<button mat-menu-item>
						<mat-icon>delete</mat-icon>
						Delete
					</button>
				</mat-menu>

				<button mat-icon-button matTooltip="Tooltip Example" color="accent">
					<mat-icon>info</mat-icon>
				</button>
			</mat-card>
		</mat-sidenav-content>
	</mat-sidenav-container>
</div>

<router-outlet></router-outlet>

<h2 mat-dialog-title color="primary">
	{{ isEdit ? "Update Role" : "Create Role" }}
</h2>
<form [formGroup]="form">
	<mat-dialog-content>
		<mat-form-field appearance="outline" class="w-100">
			<mat-label>Role Name</mat-label>
			<input matInput formControlName="name" placeholder="Enter role name" />
		</mat-form-field>
	</mat-dialog-content>
	<mat-dialog-actions align="end">
		<button type="button" mat-stroked-button color="warn" (click)="onCancel()">Cancel</button>
		<button type="submit" mat-flat-button color="primary" [disabled]="form.invalid" (click)="onSubmit()">
			{{ isEdit ? "Update" : "Create" }}
		</button>
	</mat-dialog-actions>
</form>

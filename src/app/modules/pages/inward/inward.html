<app-header-container title="Material Inward">
	<button type="button" mat-raised-button color="primary" (click)="onUpload()">
		<mat-icon>file_upload</mat-icon>
		<span>Bulk Upload</span>
	</button>

	<button type="button" mat-raised-button color="primary" (click)="onUploadSrNo()">
		<mat-icon>qr_code_2</mat-icon>
		<span>Upload Serial No.</span>
	</button>
</app-header-container>

<app-container cardClass="p-4">
	<form [formGroup]="form">
		<!-- Site -->
		@if (isAdmin) {
			<mat-form-field appearance="outline" class="w-full">
				<mat-label>Site</mat-label>
				<mat-select formControlName="siteId">
					@for (site of sites; track site.id) {
						<mat-option [value]="site.id"> {{ site.name }}</mat-option>
					}
				</mat-select>
			</mat-form-field>
		}

		<!-- Form Grid -->
		<div class="grid grid-cols-1 gap-2 md:grid-cols-2">
			<!-- Material -->
			<mat-form-field appearance="outline">
				<mat-label>Material</mat-label>

				<input
					matInput
					placeholder="Search Material"
					[matAutocomplete]="materialAuto"
					[formControl]="materialSearchControl"
				/>

				<mat-autocomplete #materialAuto="matAutocomplete" (optionSelected)="onMaterialSelected($event)">
					@for (material of materials; track material.id) {
						<mat-option [value]="material.id"> - {{ material.name }} </mat-option>
					}
				</mat-autocomplete>
			</mat-form-field>

			<!-- Quantity -->
			<mat-form-field appearance="outline">
				<mat-label>Quantity</mat-label>
				<input
					matInput
					inputmode="numeric"
					formControlName="inwardQuantity"
					placeholder="Enter Inward Quantity"
				/>
			</mat-form-field>

			<!-- Invoice -->
			<mat-form-field appearance="outline">
				<mat-label>Invoice Number</mat-label>
				<input matInput formControlName="invoice" placeholder="Enter Invoice Number" />
			</mat-form-field>

			<!-- Batch -->
			<mat-form-field appearance="outline">
				<mat-label>Batch</mat-label>
				<input matInput formControlName="batch" placeholder="Enter Batch" />
			</mat-form-field>

			<!-- Manufacturing Date -->
			<mat-form-field appearance="outline">
				<mat-label>Manufacturing Date</mat-label>

				<input
					matInput
					[matDatepicker]="picker"
					formControlName="manufacturingDate"
					placeholder="Select Manufacturing Date"
				/>

				<mat-datepicker-toggle matSuffix [for]="picker"> </mat-datepicker-toggle>

				<mat-datepicker #picker></mat-datepicker>
			</mat-form-field>

			<mat-form-field appearance="outline">
				<mat-label>Suggested Putaway Location (optional)</mat-label>
				<input matInput formControlName="batch" placeholder="Select Putaway Location" />
			</mat-form-field>
		</div>

		<!-- Actions -->
		<div class="mt-4 flex justify-end gap-2">
			<button type="button" mat-raised-button color="primary" (click)="onSave()">
				<mat-icon>save</mat-icon>
				Save
			</button>

			<button type="button" mat-stroked-button color="warn" (click)="onReset()">
				<mat-icon>refresh</mat-icon>
				Reset
			</button>
		</div>
	</form>
</app-container>

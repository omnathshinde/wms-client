<mat-toolbar [color]="data.qcStatus === 'Approved' ? 'primary' : 'warn'">
	<mat-icon class="mr-2">
		{{ data.qcStatus === "Approved" ? "verified" : "cancel" }}
	</mat-icon>

	<span> {{ data.qcStatus }} QC for {{ data.barcode }} </span>
</mat-toolbar>

<form [formGroup]="form">
	<mat-dialog-content>
		<mat-form-field appearance="outline" class="w-full">
			<mat-label>QC Remark</mat-label>
			<input matInput rows="4" formControlName="remark" placeholder="Enter QC remark" />
			<mat-hint>Min 3 characters required</mat-hint>
			@if (form.get("remark")?.hasError("required")) {
				<mat-error> Remark is required </mat-error>
			}
		</mat-form-field>
	</mat-dialog-content>

	<mat-dialog-actions align="end">
		<button
			type="submit"
			mat-flat-button
			[disabled]="form.invalid"
			[color]="data.qcStatus === 'Approved' ? 'primary' : 'warn'"
			(click)="onSubmit()"
		>
			{{ data.qcStatus }}
		</button>

		<button type="button" mat-flat-button (click)="onCancel()">Cancel</button>
	</mat-dialog-actions>
</form>

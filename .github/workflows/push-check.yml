name: 🧹 Quality Check on Commit & Push

# Run on any push or pull request
on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    code-quality:
        name: 🧩 Lint, Format & Build
        runs-on: ubuntu-latest

        steps:
            # 1️⃣ Checkout the code
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            # 2️⃣ Setup Node environment
            - name: 🧰 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            # 3️⃣ Install dependencies
            - name: 📦 Install dependencies
              run: npm ci

            # 4️⃣ Run ESLint check
            - name: 🔍 Run ESLint
              run: npm run lint --if-present

            # 5️⃣ Run Prettier format check
            - name: ✨ Check code formatting
              run: npm run format:check --if-present

            # 6️⃣ Run unit tests (optional)
            - name: 🧪 Run tests
              run: npm run test -- --watch=false --browsers=ChromeHeadless --no-progress
              continue-on-error: true # Set to false to block merges on failure

            # 7️⃣ Run production build
            - name: 🏗️ Build project
              run: npm run build --if-present
